<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elite AI Admin</title>
<style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#182033}.top{background:#172b72;color:#fff;padding:18px}.wrap{max-width:1150px;margin:20px auto;padding:0 14px}.card{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 5px 20px #0001}.login{max-width:400px;margin:80px auto}.login input,.search{width:100%;padding:12px;margin:7px 0;border:1px solid #ccd2df;border-radius:8px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#172b72;color:#fff;font-weight:700;cursor:pointer}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#eef0f7;padding:13px;border-radius:10px;min-width:120px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e6e8ee;text-align:left;vertical-align:top}select{padding:6px;border-radius:7px}.tools{display:flex;gap:8px;flex-wrap:wrap}.tablewrap{overflow:auto}@media(max-width:700px){table{font-size:12px}}</style></head><body>
<div class="top"><b>Elite AI Admin Dashboard</b><button id="logout" class="btn" style="float:right;background:#fff;color:#172b72">Logout</button></div>
<div id="login" class="login card"><h2>Administrator Login</h2><input id="user" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button class="btn" onclick="login()">Sign in</button><p id="err"></p></div>
<main id="app" class="wrap" style="display:none"><div id="stats" class="stats"></div><section class="card"><div class="tools"><input id="search" class="search" style="max-width:350px" placeholder="Search name, phone, course or reference" oninput="load()"><select id="filter" onchange="load()"><option value="">All statuses</option><option>NEW</option><option>CONTACTED</option><option>INTERESTED</option><option>APPLIED</option><option>ENROLLED</option></select><button class="btn" onclick="exportCsv()">Export CSV</button></div></section>
<section class="card"><h2>Applications & Enquiries</h2><div class="tablewrap"><table><thead><tr><th>Reference</th><th>Student</th><th>Phone</th><th>Course</th><th>Level</th><th>Message</th><th>Status</th><th>Created</th></tr></thead><tbody id="rows"></tbody></table></div></section></main>
<script>
let token=localStorage.getItem("elite_admin_v3"),loginBox=document.getElementById("login"),app=document.getElementById("app");
function show(){if(token){loginBox.style.display="none";app.style.display="block";load()}else{loginBox.style.display="block";app.style.display="none"}}async function login(){let r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user.value,password:pass.value})}),d=await r.json();if(r.ok){token=d.token;localStorage.setItem("elite_admin_v3",token);show()}else err.textContent=d.error}
async function load(){let h={Authorization:"Bearer "+token},q=encodeURIComponent(search.value),s=encodeURIComponent(filter.value);let [a,b]=await Promise.all([fetch("/api/admin/stats",{headers:h}),fetch("/api/admin/applications?q="+q+"&status="+s,{headers:h})]);if(a.status===401){localStorage.removeItem("elite_admin_v3");token=null;return show()}let st=await a.json(),d=await b.json();stats.innerHTML="<div class='stat'><b>Total</b><br>"+st.total+"</div>"+["NEW","CONTACTED","INTERESTED","APPLIED","ENROLLED"].map(x=>"<div class='stat'><b>"+x+"</b><br>"+(st.byStatus?.[x]||0)+"</div>").join("");rows.innerHTML=d.applications.map(x=>"<tr><td>"+esc(x.reference)+"</td><td>"+esc(x.name)+"<br>"+esc(x.email||"")+"</td><td>"+esc(x.phone)+"</td><td>"+esc(x.course||"-")+"</td><td>"+esc(x.level||"-")+"</td><td>"+esc(x.message||"-")+"</td><td><select onchange='change("+x.id+",this.value)'>"+["NEW","CONTACTED","INTERESTED","APPLIED","ENROLLED"].map(v=>"<option "+(v===x.status?"selected":"")+">"+v+"</option>").join("")+"</select></td><td>"+new Date(x.created_at).toLocaleString()+"</td></tr>").join("")}
async function change(id,status){await fetch("/api/admin/applications/"+id,{method:"PATCH",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({status})});load()}function exportCsv(){fetch("/api/admin/export.csv",{headers:{Authorization:"Bearer "+token}}).then(r=>r.blob()).then(b=>{let a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="elite-ai-applications.csv";a.click()})}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}logout.onclick=async()=>{await fetch("/api/admin/logout",{method:"POST",headers:{Authorization:"Bearer "+token}});localStorage.removeItem("elite_admin_v3");token=null;show()};show();
</script></body></html>
